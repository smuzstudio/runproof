[project]
name = "runproof"
version = "0.1.0"
description = "Deterministic verification that a scheduled agent actually ran, did work, and had an effect."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.scripts]
runproof = "runproof.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["runproof*"]

[tool.setuptools.package-data]
runproof = ["profiles/*.toml"]
